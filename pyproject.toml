[project]
name = "ufo-ext-pulse"
version = "0.1.0"
description = "A recurring field brief for ufo: continuity across a published series, and honest coverage"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = []

[project.entry-points."ufo.extension"]
pulse = "ufo_ext_pulse.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ufo_ext_pulse"]
