[project]
name = "ufo-integrations"
version = "0.1.0"
description = "2AM Logic's extensions for ufo: a recurring field brief, and a Matrix chat surface"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = []

[project.entry-points."ufo.extension"]
pulse = "ufo_ext_pulse.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "extensions/pulse/ufo_ext_pulse",
]

[tool.pytest.ini_options]
testpaths = ["extensions"]
pythonpath = ["extensions/pulse/tests"]
