[project]
name = "ufo-integrations"
version = "0.1.0"
description = "2AM Logic's extensions for ufo: a recurring field brief, and a Matrix chat surface"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# Olm and Megolm for encrypted Matrix rooms. Native modules, and this distribution also ships the
# pulse skill pack, so an install that wants neither downloads neither.
matrix-e2ee = ["vodozemac>=0.10", "cryptography>=49"]

[project.entry-points."ufo.extension"]
pulse = "ufo_ext_pulse.manifest:manifest"
matrix = "ufo_ext_matrix.manifest:manifest"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = [
    "extensions/pulse/ufo_ext_pulse",
    "extensions/matrix/ufo_ext_matrix",
]

[tool.ruff]
# The house wrap is 100 columns, and ruff's own default is 88: a file written to the house style
# reads as drift against the default, so the number is stated here rather than left implied.
line-length = 100
# Overriding the default list rather than extending it. Ruff added Markdown to its own default
# discovery, and the skills this repo ships are Markdown holding fenced Python written for a reader
# — a prose budget, not a formatter's. Naming the two source suffixes keeps a later ruff from
# reformatting a SKILL.md.
include = ["*.py", "*.pyi"]
# Installer-managed trees. `.claude/skills/repo/scripts/` is vendored from rjwalters/repo and is
# refreshed by its installer, so a fix made here is reverted there.
extend-exclude = [".claude"]

[tool.ruff.lint]
# Ruff's own default selection widened between releases, so a lane that inherits it inherits a
# contract that moves under a version bump: pyflakes and the three pycodestyle groups are named
# here so the pin in `.github/workflows/ci.yml` decides the ruff binary and this decides the rules.
# `E5` is absent because line length is the formatter's to hold, and it holds it at the wrap above.
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["extensions"]
pythonpath = ["extensions/pulse/tests", "extensions/matrix", "extensions/matrix/tests"]
