name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

jobs:
  contracts:
    name: skill and ledger contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest --with pyyaml pytest extensions -v

  workflow-lint:
    name: workflow syntax and gate scripts
    # No path filter, and no ufo or crypto extra: this lane costs seconds, and a filtered job that
    # skips reads as passing when it is a required check (rule 6 of .loom/docs/ci-principles.md).
    # actionlint runs shellcheck over every `run:` block on the runner, so the shell embedded in a
    # step is read too. The gate scripts live in .github/scripts/ because actionlint cannot read a
    # heredoc's Python, and a syntax error there would otherwise surface at job runtime, inside a
    # step whose purpose is to fail for a different reason.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: actionlint over every workflow
        run: |
          bash <(curl -fsS https://raw.githubusercontent.com/rhysd/actionlint/v1.7.12/scripts/download-actionlint.bash) 1.7.12
          ./actionlint -color
      - name: Every gate script compiles
        run: |
          set -euo pipefail
          scripts=$(find .github/scripts -name '*.py' | sort)
          if [ -z "$scripts" ]; then
            echo "::error::no gate script found, so this step is checking an empty rule"
            exit 1
          fi
          echo "$scripts" | xargs python3 -m py_compile
          echo "compiled: $(echo "$scripts" | tr '\n' ' ')"

  format:
    name: ruff, at one pinned version
    # No path filter: a misformatted file lands anywhere in the tree, and a filtered job that skips
    # reads as passing when it is a required check (rule 6 of .loom/docs/ci-principles.md). The
    # version is exact rather than `--with ruff`, because ruff's default rule selection and its file
    # discovery both widened across releases: an unpinned lane answers a different question each
    # week, and a resolver, not this repository, would decide when the answer changed. What the pin
    # holds is the binary; `[tool.ruff]` in pyproject.toml holds the rules and the wrap.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with "ruff==0.16.9" ruff check .
      - run: uv run --python 3.12 --with "ruff==0.16.9" ruff format --check .

  types:
    name: mypy, at one pinned version
    # No path filter, for the reason the job above carries none, and the version is exact for that
    # job's reason too: mypy's inference and its default strictness both move across releases, so an
    # unpinned lane answers a different question each week. The pin holds the binary; `[tool.mypy]`
    # in pyproject.toml holds the checks.
    #
    # Two invocations, split by the dependency shape each package is written against — the same
    # split the `registry` and `without-the-crypto-extra` jobs already draw. The matrix extension
    # reaches vodozemac, so its lane installs `matrix-e2ee`; without it, `crypto.py` reports a
    # missing stub for a module the lane simply did not install, which says nothing about the code.
    # Pulse imports neither, so its lane installs neither and the absence is checked rather than
    # assumed. Both carry `ufo` from git: an extension is type-checked against the SDK it loads at
    # runtime, whose `py.typed` marker makes that surface checkable.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: The matrix extension, against ufo and the crypto extra
        run: |
          uv run --python 3.12 --extra matrix-e2ee --with "mypy==2.3.1" \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            mypy extensions/matrix/ufo_ext_matrix
      - name: The pulse extension, against ufo alone
        run: |
          uv run --python 3.12 --with "mypy==2.3.1" \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            mypy extensions/pulse/ufo_ext_pulse

  lineage:
    name: one lineage across every open pull request
    # A revision id is an identity two branches assign independently, and the clash lives in their
    # union: each branch is a sound chain alone, and the filenames differ, so the merge reports no
    # conflict. GitHub builds one merge with the base per pull request, never a merge of two of them,
    # so this job assembles that union itself. Rule 5 of .loom/docs/ci-principles.md scopes it to the
    # event that motivates it: a pull request is where a claim can be renumbered, and `main`'s own
    # lineage is already checked by the job above.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Depth 2 ungrafts the merge commit's parents, which the next step reads.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
      - name: This ref is the pull request merged into its base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merged=$(git rev-parse HEAD^2) || {
            echo "::error::checked out a branch tree, not the merge with the base"
            exit 1
          }
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::HEAD^2 is $merged, not this pull request's head $HEAD_SHA"
            exit 1
          fi
          echo "HEAD is $(git rev-parse HEAD): $HEAD_SHA merged into $(git rev-parse HEAD^1)"
      # A revision id belongs to whichever pull requests declare one, and only they can renumber it,
      # so a pull request that declares no migration is not held to the union: rule 1 of
      # ci-principles.md counts a misattributed failure as the dearer of the two costs. Every party to
      # a collision declares one of its files, so each of them still turns red.
      #
      # Two pull requests writing the same path are the case git already reports: the second merge
      # conflicts. Each path is laid down in turn, so the last writer of one path wins here.
      - name: One chain across the union of the open pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          migrations='^extensions/[^/]+/ufo_ext_[^/]+/migrations/.+\.py$'
          mine=$(git diff --name-only HEAD^1 HEAD -- extensions | grep -E "$migrations") || {
            echo "this pull request declares no migration, so it holds no revision id to renumber"
            exit 0
          }
          echo "this pull request declares: $(echo "$mine" | tr '\n' ' ')"
          for pull in $(gh pr list --state open --limit 200 --json number --jq '.[].number'); do
            ref="refs/ci/pull-$pull"
            git fetch --no-tags --depth=1 origin "refs/pull/$pull/head:$ref"
            files=$(git ls-tree -r --name-only "$ref" -- extensions | grep -E "$migrations") || continue
            echo "pull request #$pull: $(echo "$files" | tr '\n' ' ')"
            echo "$files" | tr '\n' '\0' | xargs -0 git checkout "$ref" --
          done
          git status --short
          uv run --python 3.12 --with pytest --with pyyaml \
            pytest extensions/test_migration_lineage.py -v

  registry:
    name: against ufo from git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ufo and the crypto extra, and run every test
        run: |
          uv run --python 3.12 --extra matrix-e2ee \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            pytest extensions -v -rs --junitxml=pytest-report.xml
      - name: Every test ran, the registry test among them
        run: |
          python3 .github/scripts/registry_ran.py pytest-report.xml

  against-a-homeserver:
    name: the gated suites against a Synapse container
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # A `services:` container cannot be handed the configuration this needs: the image writes its
      # own on first start, and what it writes has registration off, so the suite would have no way
      # to provision the two accounts a round trip is between. The container is generated,
      # configured and started here instead, and the file it is configured with is read back below
      # so a homeserver that came up refusing registration fails this step rather than the suite.
      - name: A throwaway Synapse, with registration open
        run: |
          set -euo pipefail
          mkdir -p synapse-data
          docker run --rm -v "$PWD/synapse-data:/data" \
            -e SYNAPSE_SERVER_NAME=integration.test -e SYNAPSE_REPORT_STATS=no \
            ghcr.io/element-hq/synapse:latest generate
          # The generated file ends in a comment and no newline, so the first line appended here is
          # blank; the rate limits are Synapse's own defaults raised out of the way, since one test
          # registers two accounts and logs one of them in twice, which the defaults refuse.
          cat > synapse-extra.yaml <<'YAML'

          enable_registration: true
          enable_registration_without_verification: true
          rc_registration:
            per_second: 1000
            burst_count: 1000
          rc_login:
            address:
              per_second: 1000
              burst_count: 1000
            account:
              per_second: 1000
              burst_count: 1000
            failed_attempts:
              per_second: 1000
              burst_count: 1000
          rc_message:
            per_second: 1000
            burst_count: 1000
          YAML
          docker run --rm --user root --entrypoint /bin/sh \
            -v "$PWD/synapse-data:/data" -v "$PWD/synapse-extra.yaml:/extra.yaml:ro" \
            ghcr.io/element-hq/synapse:latest -c 'cat /extra.yaml >> /data/homeserver.yaml'
          docker run -d --name synapse -p 8008:8008 -v "$PWD/synapse-data:/data" \
            ghcr.io/element-hq/synapse:latest
          for _ in $(seq 1 90); do
            if curl -fs http://127.0.0.1:8008/_matrix/client/versions >/dev/null 2>&1; then
              echo "the homeserver answers"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the homeserver never answered, so nothing here was tested"
          docker logs synapse
          exit 1
      # The directory rather than a file: `conftest.py` ignores every gated module when the env var
      # is unset, so naming one leaves the others collected by nobody — which is how the surface
      # suite went unrun. What the gate holds back is the unit this job owes a homeserver to.
      - name: The gated suites against it
        env:
          MATRIX_INTEGRATION_HOMESERVER: http://127.0.0.1:8008
        run: |
          uv run --python 3.12 --extra matrix-e2ee \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            pytest extensions/matrix/tests \
            -v -rs --junitxml=pytest-report.xml
      - name: Every gated module ran, and no test in it skipped
        run: |
          python3 .github/scripts/homeserver_ran.py pytest-report.xml extensions/matrix/tests
      - name: What the homeserver made of it
        if: failure()
        run: docker logs synapse

  without-the-crypto-extra:
    name: against ufo without the crypto extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # ufo declares `Requires-Dist: cryptography>=49.0.0`, so `cryptography` is present in this lane
      # whatever this project asks for, and `vodozemac` alone is what the extra adds here. A lane that
      # quietly held both would pass every check below while testing nothing it claims to.
      - name: vodozemac is absent here and cryptography is present
        run: |
          uv run --python 3.12 \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            python .github/scripts/lane_without_extra.py
      - name: Install ufo alone and run every test
        run: |
          uv run --python 3.12 \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            pytest extensions -v -rs --junitxml=pytest-report.xml
      - name: Only test_matrix_crypto skipped, and it did skip
        run: |
          python3 .github/scripts/crypto_skips_only.py pytest-report.xml
