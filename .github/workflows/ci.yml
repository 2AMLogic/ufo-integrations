name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    name: skill and ledger contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest --with pyyaml pytest extensions -v

  registry:
    name: against ufo from git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ufo and run every test
        run: |
          uv run --python 3.12 \
            --with pytest --with pyyaml \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core" \
            pytest extensions -v
