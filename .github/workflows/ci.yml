name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * *"

jobs:
  contracts:
    name: skill and ledger contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv run --python 3.12 --with pytest --with pyyaml pytest extensions -v

  lineage:
    name: one lineage across every open pull request
    # A revision id is an identity two branches assign independently, and the clash lives in their
    # union: each branch is a sound chain alone, and the filenames differ, so the merge reports no
    # conflict. GitHub builds one merge with the base per pull request, never a merge of two of them,
    # so this job assembles that union itself. Rule 5 of .loom/docs/ci-principles.md scopes it to the
    # event that motivates it: a pull request is where a claim can be renumbered, and `main`'s own
    # lineage is already checked by the job above.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Depth 2 ungrafts the merge commit's parents, which the next step reads.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: astral-sh/setup-uv@v6
      - name: This ref is the pull request merged into its base
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          merged=$(git rev-parse HEAD^2) || {
            echo "::error::checked out a branch tree, not the merge with the base"
            exit 1
          }
          if [ "$merged" != "$HEAD_SHA" ]; then
            echo "::error::HEAD^2 is $merged, not this pull request's head $HEAD_SHA"
            exit 1
          fi
          echo "HEAD is $(git rev-parse HEAD): $HEAD_SHA merged into $(git rev-parse HEAD^1)"
      # A revision id belongs to whichever pull requests declare one, and only they can renumber it,
      # so a pull request that declares no migration is not held to the union: rule 1 of
      # ci-principles.md counts a misattributed failure as the dearer of the two costs. Every party to
      # a collision declares one of its files, so each of them still turns red.
      #
      # Two pull requests writing the same path are the case git already reports: the second merge
      # conflicts. Each path is laid down in turn, so the last writer of one path wins here.
      - name: One chain across the union of the open pull requests
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          migrations='^extensions/[^/]+/ufo_ext_[^/]+/migrations/.+\.py$'
          mine=$(git diff --name-only HEAD^1 HEAD -- extensions | grep -E "$migrations") || {
            echo "this pull request declares no migration, so it holds no revision id to renumber"
            exit 0
          }
          echo "this pull request declares: $(echo "$mine" | tr '\n' ' ')"
          for pull in $(gh pr list --state open --json number --jq '.[].number'); do
            ref="refs/ci/pull-$pull"
            git fetch --no-tags --depth=1 origin "refs/pull/$pull/head:$ref"
            files=$(git ls-tree -r --name-only "$ref" -- extensions | grep -E "$migrations") || continue
            echo "pull request #$pull: $(echo "$files" | tr '\n' ' ')"
            echo "$files" | tr '\n' '\0' | xargs -0 git checkout "$ref" --
          done
          git status --short
          uv run --python 3.12 --with pytest --with pyyaml \
            pytest extensions/test_migration_lineage.py -v

  registry:
    name: against ufo from git
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install ufo and the crypto extra, and run every test
        run: |
          uv run --python 3.12 --extra matrix-e2ee \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            pytest extensions -v -rs --junitxml=pytest-report.xml
      - name: Every test ran, the registry test among them
        run: |
          python3 - pytest-report.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          skipped = [f"{c.get('classname')}::{c.get('name')}" for c in cases if c.find("skipped") is not None]
          registry = [c for c in cases if "test_registry" in c.get("classname", "") and c.find("skipped") is None]
          if skipped:
              print("::error::this job runs against ufo, so no test may skip")
              print("\n".join(skipped))
              sys.exit(1)
          if not registry:
              print("::error::the registry test did not run")
              sys.exit(1)
          print(f"{len(cases)} tests ran, {len(registry)} of them against the registry, none skipped")
          PY

  without-the-crypto-extra:
    name: against ufo without the crypto extra
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # ufo declares `Requires-Dist: cryptography>=49.0.0`, so `cryptography` is present in this lane
      # whatever this project asks for, and `vodozemac` alone is what the extra adds here. A lane that
      # quietly held both would pass every check below while testing nothing it claims to.
      - name: vodozemac is absent here and cryptography is present
        run: |
          uv run --python 3.12 \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            python - <<'PY'
          import sys
          from importlib.util import find_spec

          if find_spec("vodozemac") is not None:
              print("::error::vodozemac is installed, so this is not the lane without the extra")
              sys.exit(1)
          if find_spec("cryptography") is None:
              print("::error::cryptography is absent, so ufo is not installed and neither is the lane")
              sys.exit(1)
          print("vodozemac absent, cryptography present: the extra is what is missing, and only it")
          PY
      - name: Install ufo alone and run every test
        run: |
          uv run --python 3.12 \
            --with pytest --with pyyaml --with pytest-xdist \
            --with "ufo @ git+https://github.com/ufo-ai/ufo-core@main" \
            pytest extensions -v -rs --junitxml=pytest-report.xml
      - name: Only test_matrix_crypto skipped, and it did skip
        run: |
          python3 - pytest-report.xml <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          # A module-level `pytest.importorskip` skips collection, and junitxml reports that as
          # `classname=''` with the module's dotted path in `name` — the opposite placement from a
          # skipped test function, which names its module in `classname`. Reading the pair as one
          # string is what lets this gate bless the one skip it exists for; matching `classname`
          # alone called that skip a stray and turned the step red.
          cases = list(ET.parse(sys.argv[1]).iter("testcase"))
          named = [
              f"{c.get('classname', '')}::{c.get('name', '')}"
              for c in cases
              if c.find("skipped") is not None
          ]
          stray = [where for where in named if "test_matrix_crypto" not in where]
          if stray:
              print("::error::the crypto extra's absence may silence only the crypto tests")
              print("\n".join(stray))
              sys.exit(1)
          if not named:
              print("::error::the crypto tests did not skip, so the extra was installed after all")
              sys.exit(1)
          print(f"{len(cases)} tests ran, {len(named)} skipped, all of test_matrix_crypto:")
          print("\n".join(named))
          PY
